<!--
  This file is never linked or shown to visitors. It exists purely so
  Netlify's build-time form detector (which scans static HTML in the
  publish directory) can find and register the "quote-request" form —
  Next.js renders the real form dynamically, which Netlify's bot can't
  always see on its own. Keep this file's fields in sync with
  src/components/Contact.tsx.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form detection</title>
  </head>
  <body>
    <form name="quote-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="address" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
